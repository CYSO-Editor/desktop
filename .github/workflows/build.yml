name: Build

# 自动构建：每次 push / PR 到 master 时自动编译三个平台的安装包（作为 Actions 工件，不做签名）。
# 仅在推送「版本号标签」（如 v1.2.0）时，才会额外把各平台、各架构的独立安装文件发布到 GitHub Release 草稿
# （草稿需手动编辑说明并点 Publish 才公开）。
# 也可在 Actions 页面手动点 Run workflow 运行。
#
# desktop 依赖 10 个本地 ../ 兄弟仓库，CI 上并不存在这些目录，因此克隆到仓库同级目录（与本地开发布局一致）。
# 全部来自自有 fork（CYSO-Editor 组织）：scratch-gui / scratch-paint / CYSO-Core / extensions / scratch-vm /
# scratch-blocks / scratch-storage / scratch-render / scratch-audio / scratch-parser。
# 其中后5 个原本只连官方上游，现已 fork 到 CYSO-Editor 下（避免 CI 依赖外部组织的可用性）：
#   scratch-blocks 与 scratch-storage 是 package.json 里声明的 ../ 本地依赖（缺了 npm install 直接失败）；
#   scratch-render / scratch-audio / scratch-parser 被 webpack.config.cjs 以源码模式或别名引用
#   （scratch-parser 还提供 node_modules/ajv 供 ajv$ 别名使用）。
# 注意：直接克隆各兄弟仓库的默认分支最新提交，不锁定具体 SHA——构建结果会随兄弟仓库更新而变化，
# 不复现固定版本。若需要可复现构建，请改回锁定具体提交（见历史提交）。

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout desktop
      uses: actions/checkout@v4
    - name: Checkout sibling repositories
      run: |
        clone_sibling() {
          local name=$1
          echo "Cloning $name (default branch)"
          git clone --quiet "https://github.com/CYSO-Editor/$name.git" "${{ github.workspace }}/../$name"
        }
        clone_sibling scratch-gui
        clone_sibling scratch-paint
        clone_sibling CYSO-Core
        clone_sibling extensions
        clone_sibling scratch-vm
        clone_sibling scratch-blocks
        clone_sibling scratch-storage
        clone_sibling scratch-render
        clone_sibling scratch-audio
        clone_sibling scratch-parser
    - name: Install strip-nondeterminism
      run: sudo apt-get install strip-nondeterminism
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install dependencies
      run: npm install --no-audit --no-fund
    - name: Install sibling dependencies
      run: |
        set -e
        for name in scratch-gui scratch-paint CYSO-Core extensions scratch-vm \
                    scratch-blocks scratch-storage scratch-render scratch-audio scratch-parser; do
          echo "Installing deps for $name"
          (cd "${{ github.workspace }}/../$name" && npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund)
        done
    - name: Link node_modules for sibling resolution
      run: |
        PARENT="${{ github.workspace }}/../node_modules"
        DESKTOP_NM="${{ github.workspace }}/node_modules"
        mkdir -p "$PARENT"
        # 保留 npm 在 PARENT（兄弟仓库公共父级）里提升的依赖（scratch-render / scratch-blocks /
        # scratch-paint 等 scratch-gui 需要但未声明、由 scratch-vm 等间接带入的包），
        # 再把 desktop 自身依赖（adm-zip 等）软链进 PARENT，使各兄弟仓库都能解析。
        # 注意：绝不能 rm -rf PARENT，否则会删除 npm 已提升的依赖。
        for entry in "$DESKTOP_NM"/*; do
          b=$(basename "$entry")
          [ -e "$PARENT/$b" ] || ln -s "$entry" "$PARENT/$b"
        done
    # scratch-gui 的 src/addons/*（addons / libraries / generated 等）已在仓库中提交，
    # 无需在 CI 里 git clone TurboWarp/addons 再跑 pull.js（该克隆在 CI 上会失败且结果已提交）。
    # 仅需 prepublish.mjs 生成仓库中未提交的 microbit-hex-url.cjs。
    - name: Generate scratch-gui assets
      run: |
        cd "${{ github.workspace }}/../scratch-gui"
        node scripts/prepublish.mjs
    - name: Fetch
      # download-library-files 会尝试从 assets.scratch.mit.edu 拉 1304 个素材，
      # 该域名在部分网络（含国内与部分 Runner）不可达，失败会让整个 job 中断。
      # 它只是离线素材加速缓存，缺失时运行期会回退到官方网络，故容忍失败。
      run: npm run fetch || echo "::warning::fetch 步骤部分失败（离线素材缓存缺失，不影响构建）"
    - name: Build scratch-paint
      # scratch-paint 的 package.json main 指向 ./dist/scratch-paint.js，
      # 而 CI 用 --ignore-scripts 安装依赖跳过了其 webpack 构建，导致 dist 缺失。
      # 这里显式构建它（复刻本地已构建的布局）。
      run: |
        cd "${{ github.workspace }}/../scratch-paint"
        npm run build
    - name: Link scratch-paint for scratch-gui
      # scratch-blocks / scratch-render 已在 scratch-gui 的 package.json 中声明，
      # 随 npm install 就位；scratch-paint 额外显式链接一次作为保险。
      run: |
        mkdir -p "${{ github.workspace }}/../scratch-gui/node_modules"
        ln -sfn "${{ github.workspace }}/../scratch-paint" "${{ github.workspace }}/../scratch-gui/node_modules/scratch-paint"
    - name: Compile
      run: npm run webpack:prod
    - name: Package
      run: |
        node release-automation/build.mjs --debian --tarball --appimage --x64 --arm64
    - name: Print file tree
      run: node scripts/print-file-tree.mjs dist
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux
        path: |
          dist/*.deb
          dist/*.tar.gz
          dist/*.AppImage

  build-mac:
    runs-on: macos-latest
    steps:
    - name: Checkout desktop
      uses: actions/checkout@v4
    - name: Checkout sibling repositories
      run: |
        clone_sibling() {
          local name=$1
          echo "Cloning $name (default branch)"
          git clone --quiet "https://github.com/CYSO-Editor/$name.git" "${{ github.workspace }}/../$name"
        }
        clone_sibling scratch-gui
        clone_sibling scratch-paint
        clone_sibling CYSO-Core
        clone_sibling extensions
        clone_sibling scratch-vm
        clone_sibling scratch-blocks
        clone_sibling scratch-storage
        clone_sibling scratch-render
        clone_sibling scratch-audio
        clone_sibling scratch-parser
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install dependencies
      run: npm install --no-audit --no-fund
    - name: Install sibling dependencies
      run: |
        set -e
        for name in scratch-gui scratch-paint CYSO-Core extensions scratch-vm \
                    scratch-blocks scratch-storage scratch-render scratch-audio scratch-parser; do
          echo "Installing deps for $name"
          (cd "${{ github.workspace }}/../$name" && npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund)
        done
    - name: Link node_modules for sibling resolution
      run: |
        PARENT="${{ github.workspace }}/../node_modules"
        DESKTOP_NM="${{ github.workspace }}/node_modules"
        mkdir -p "$PARENT"
        # 保留 npm 在 PARENT（兄弟仓库公共父级）里提升的依赖（scratch-render / scratch-blocks /
        # scratch-paint 等 scratch-gui 需要但未声明、由 scratch-vm 等间接带入的包），
        # 再把 desktop 自身依赖（adm-zip 等）软链进 PARENT，使各兄弟仓库都能解析。
        # 注意：绝不能 rm -rf PARENT，否则会删除 npm 已提升的依赖。
        for entry in "$DESKTOP_NM"/*; do
          b=$(basename "$entry")
          [ -e "$PARENT/$b" ] || ln -s "$entry" "$PARENT/$b"
        done
    # scratch-gui 的 src/addons/*（addons / libraries / generated 等）已在仓库中提交，
    # 无需在 CI 里 git clone TurboWarp/addons 再跑 pull.js（该克隆在 CI 上会失败且结果已提交）。
    # 仅需 prepublish.mjs 生成仓库中未提交的 microbit-hex-url.cjs。
    - name: Generate scratch-gui assets
      run: |
        cd "${{ github.workspace }}/../scratch-gui"
        node scripts/prepublish.mjs
    - name: Fetch
      # download-library-files 会尝试从 assets.scratch.mit.edu 拉 1304 个素材，
      # 该域名在部分网络（含国内与部分 Runner）不可达，失败会让整个 job 中断。
      # 它只是离线素材加速缓存，缺失时运行期会回退到官方网络，故容忍失败。
      run: npm run fetch || echo "::warning::fetch 步骤部分失败（离线素材缓存缺失，不影响构建）"
    - name: Build scratch-paint
      # scratch-paint 的 package.json main 指向 ./dist/scratch-paint.js，
      # 而 CI 用 --ignore-scripts 安装依赖跳过了其 webpack 构建，导致 dist 缺失。
      # 这里显式构建它（复刻本地已构建的布局）。
      run: |
        cd "${{ github.workspace }}/../scratch-paint"
        npm run build
    - name: Link scratch-paint for scratch-gui
      # scratch-blocks / scratch-render 已在 scratch-gui 的 package.json 中声明，
      # 随 npm install 就位；scratch-paint 额外显式链接一次作为保险。
      run: |
        mkdir -p "${{ github.workspace }}/../scratch-gui/node_modules"
        ln -sfn "${{ github.workspace }}/../scratch-paint" "${{ github.workspace }}/../scratch-gui/node_modules/scratch-paint"
    - name: Compile
      run: npm run webpack:prod
    - name: Package
      run: |
        # fsevents（仅 macOS 的原生依赖，经 watchpack-chokidar2 间接引入）无法针对 Electron 40 的
        # Node 头文件编译，且打包后的应用运行时并不需要它。打包前删除它，避免 electron-builder 重建失败。
        find "${{ github.workspace }}" -name fsevents -type d -prune -exec rm -rf {} + 2>/dev/null || true
        find "${{ github.workspace }}/.." -name fsevents -type d -prune -exec rm -rf {} + 2>/dev/null || true
        node release-automation/build.mjs --mac --universal
    - name: Print file tree
      run: node scripts/print-file-tree.mjs dist
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mac
        path: dist/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout desktop
      uses: actions/checkout@v4
      with:
        path: repo
    - name: Move repository to D drive
      run: |
        Copy-Item -Path repo -Destination D:\repo -Recurse
        Remove-Item -Path repo -Recurse -Force
    - name: Checkout sibling repositories
      shell: pwsh
      run: |
        $sibs = @('scratch-gui','scratch-paint','CYSO-Core','extensions','scratch-vm',
                  'scratch-blocks','scratch-storage','scratch-render','scratch-audio','scratch-parser')
        foreach ($name in $sibs) {
          $dest = "D:\$name"
          Write-Host "Cloning CYSO-Editor/$name (default branch) -> $dest"
          git clone --quiet "https://github.com/CYSO-Editor/$name.git" $dest
        }
    - name: Configure npm to use D drive
      run: |
        npm config set cache D:\npm-cache
        npm config set prefix D:\npm-prefix
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install dependencies
      working-directory: D:\repo
      run: npm install --no-audit --no-fund
    - name: Install sibling dependencies
      shell: pwsh
      run: |
        foreach ($name in @('scratch-gui','scratch-paint','CYSO-Core','extensions','scratch-vm',
                            'scratch-blocks','scratch-storage','scratch-render','scratch-audio','scratch-parser')) {
          $dir = "D:\$name"
          Write-Host "Installing deps for $name in $dir"
          Push-Location $dir
          npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install failed for $name" }
          Pop-Location
        }
    - name: Link node_modules for sibling resolution
      shell: pwsh
      run: |
        $Parent = "D:\node_modules"
        $DesktopNM = "D:\repo\node_modules"
        if (-not (Test-Path $Parent)) { New-Item -ItemType Directory -Path $Parent | Out-Null }
        # 保留 npm 在 D:\node_modules（兄弟仓库公共父级）里提升的依赖（scratch-render 等），
        # 再把 desktop 自身依赖（adm-zip 等）以联接(junction)并入，使各兄弟仓库都能解析。
        foreach ($item in Get-ChildItem $DesktopNM) {
          $target = Join-Path $Parent $item.Name
          if (-not (Test-Path $target)) {
            cmd /c "mklink /J `"$target`" `"$($item.FullName)`""
          }
        }
    # scratch-gui 的 src/addons/* 已提交，无需 pull.js（其 git clone 在 CI 上会失败）。仅生成 microbit 资源。
    - name: Generate scratch-gui assets
      shell: pwsh
      run: |
        Push-Location D:\scratch-gui
        node scripts/prepublish.mjs
        Pop-Location
    - name: Fetch
      # download-library-files 会尝试从 assets.scratch.mit.edu 拉 1304 个素材，
      # 该域名在部分网络（含国内与部分 Runner）不可达，失败会让整个 job 中断。
      # 它只是离线素材加速缓存，缺失时运行期会回退到官方网络，故容忍失败。
      working-directory: D:\repo
      shell: pwsh
      run: |
        npm run fetch
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::warning::fetch 步骤部分失败（离线素材缓存缺失，不影响构建）"
          exit 0
        }
    - name: Build scratch-paint
      shell: pwsh
      # scratch-paint 的 main 指向 ./dist/scratch-paint.js，需先构建（CI 跳过了其构建脚本）。
      run: |
        Push-Location D:\scratch-paint
        npm run build
        Pop-Location
    - name: Link scratch-paint for scratch-gui
      shell: pwsh
      # scratch-blocks / scratch-render 已在 scratch-gui 的 package.json 中声明，
      # 随 npm install 就位；scratch-paint 额外显式链接一次作为保险。
      run: |
        New-Item -ItemType Directory -Force -Path D:\scratch-gui\node_modules | Out-Null
        if (Test-Path D:\scratch-gui\node_modules\scratch-paint) { Remove-Item D:\scratch-gui\node_modules\scratch-paint -Force -Recurse }
        cmd /c "mklink /J D:\scratch-gui\node_modules\scratch-paint D:\scratch-paint"
    - name: Compile
      working-directory: D:\repo
      run: npm run webpack:prod
    - name: Package
      working-directory: D:\repo
      run: |
        node release-automation/build.mjs --windows --x64 --arm64
        node release-automation/build.mjs --windows-portable --x64 --arm64
    - name: Print file tree
      working-directory: D:\repo
      run: node scripts/print-file-tree.mjs dist
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows
        path: D:\repo\dist\*.exe

  release:
    name: Publish draft release
    needs: [build-linux, build-mac, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: ./artifacts/linux
      - name: Download mac artifact
        uses: actions/download-artifact@v4
        with:
          name: mac
          path: ./artifacts/mac
      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: ./artifacts/windows
      - name: Collect installers (flatten)
        run: |
          mkdir -p release
          find ./artifacts -type f -exec cp -t ./release {} +
          echo "Release files:"
          ls -la release
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          draft: true
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: release/*
