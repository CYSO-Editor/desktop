<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' cysoeditor://* tw-extensions://*; frame-src 'self' blob: cysoeditor://* tw-extensions://* https: http: data:; child-src 'self' blob:; connect-src 'self' cysoeditor://* tw-extensions://* https://gh-proxy.org https://raw.githubusercontent.com https://cyscrexthub.cc.cd https: http:; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob: data: https://gh-proxy.org https://raw.githubusercontent.com https://cyscrexthub.cc.cd https: cysoeditor://* tw-extensions://*; script-src-elem 'self' 'unsafe-inline' blob: data: https://gh-proxy.org https://raw.githubusercontent.com https://cyscrexthub.cc.cd https: cysoeditor://* tw-extensions://*; worker-src 'self' blob: https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' blob: data: https://gh-proxy.org https://raw.githubusercontent.com https://cyscrexthub.cc.cd https: http: cysoeditor://* tw-extensions://*; font-src 'self' blob: data: https:; media-src 'self' blob: data: cysoeditor://* tw-extensions://* https:">
    <!-- Unfortunately can't really enforce a CSP due to custom extensions -->
    <style>
      .splash-screen {
        --aurora:
          radial-gradient(circle at 20% 30%, rgba(70, 220, 160, 0.40) 0%, transparent 35%),
          radial-gradient(circle at 80% 70%, rgba(150, 90, 230, 0.50) 0%, transparent 40%),
          radial-gradient(circle at 45% 75%, rgba(240, 160, 180, 0.45) 0%, transparent 30%),
          radial-gradient(circle at 65% 25%, rgba(50, 200, 220, 0.35) 0%, transparent 45%),
          linear-gradient(145deg, #030617, #1b263b, #030617);
        --text: #eef3ff;
        --text-dim: rgba(238, 243, 255, 0.62);
        --accent: #4f8ec2;

        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: var(--aurora);
        transition: opacity 0.7s ease;
        --p: 0%;
      }
      .splash-screen[hidden] {
        display: none;
      }
      .splash-screen.splash-done {
        opacity: 0;
        pointer-events: none;
      }

      .aurora-field {
        position: absolute;
        inset: -12%;
        z-index: 1;
        background: var(--aurora);
        animation: auroraBreathe 9s ease-in-out infinite;
        -webkit-mask-image: linear-gradient(to right, #000 var(--p), rgba(0, 0, 0, 0) calc(var(--p) + 13%));
        mask-image: linear-gradient(to right, #000 var(--p), rgba(0, 0, 0, 0) calc(var(--p) + 13%));
        will-change: transform;
      }
      .blob {
        position: absolute;
        width: 60vmax;
        height: 60vmax;
        border-radius: 50%;
        filter: blur(20px);
        opacity: 0.7;
        mix-blend-mode: screen;
      }
      .splash-screen[data-theme="light"] .blob,
      .splash-screen[data-theme="misty-sand"] .blob {
        mix-blend-mode: multiply;
        opacity: 0.46;
      }
      .blob-green  { top: -10%; left: -8%;   background: radial-gradient(circle at 50% 50%, rgba(70, 220, 160, 0.55) 0%, rgba(70, 220, 160, 0) 65%);  animation: driftGreen  22s ease-in-out infinite; }
      .blob-purple { bottom: -14%; right: -6%; background: radial-gradient(circle at 50% 50%, rgba(150, 90, 230, 0.62) 0%, rgba(150, 90, 230, 0) 66%); animation: driftPurple 26s ease-in-out infinite; }
      .blob-pink   { bottom: -16%; left: 28%;  background: radial-gradient(circle at 50% 50%, rgba(240, 160, 180, 0.55) 0%, rgba(240, 160, 180, 0) 60%); animation: driftPink   20s ease-in-out infinite; }
      .blob-cyan   { top: -12%; right: 16%;   background: radial-gradient(circle at 50% 50%, rgba(50, 200, 220, 0.48) 0%, rgba(50, 200, 220, 0) 68%); animation: driftCyan   24s ease-in-out infinite; }

      .aurora-stream {
        position: absolute;
        inset: 0;
        background: linear-gradient(116deg,
          rgba(70, 220, 160, 0) 0%,
          rgba(70, 220, 160, 0.34) 11%,
          rgba(150, 90, 230, 0.30) 27%,
          rgba(240, 160, 180, 0.28) 43%,
          rgba(50, 200, 220, 0.34) 59%,
          rgba(120, 200, 255, 0.26) 75%,
          rgba(70, 220, 160, 0) 100%);
        background-size: 230% 230%;
        filter: blur(1.5px) saturate(135%);
        opacity: 0.9;
      }
      .splash-screen[data-theme="light"] .aurora-stream,
      .splash-screen[data-theme="misty-sand"] .aurora-stream {
        opacity: 0.5;
      }
      .aurora-stream.dir-r { animation: flowR 2.6s linear infinite; }
      .aurora-stream.dir-l { animation: flowL 2.6s linear infinite; }
      .aurora-stream.dir-u { animation: flowU 2.6s linear infinite; }
      .aurora-stream.dir-d { animation: flowD 2.6s linear infinite; }

      .aurora-veil {
        position: absolute;
        inset: 0;
        background: var(--aurora);
        opacity: 0.1;
        animation: veilPulse 9s ease-in-out infinite;
      }
      .aurora-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 120% at 50% 45%, transparent 58%, rgba(0, 0, 0, 0.42) 100%);
        pointer-events: none;
      }
      .splash-screen[data-theme="light"] .aurora-vignette,
      .splash-screen[data-theme="misty-sand"] .aurora-vignette {
        background: radial-gradient(120% 120% at 50% 45%, transparent 60%, rgba(20, 28, 44, 0.26) 100%);
      }

      .brand {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        pointer-events: none;
        text-shadow: 0 2px 22px rgba(0, 0, 0, 0.45);
      }
      .splash-screen[data-theme="light"] .brand,
      .splash-screen[data-theme="misty-sand"] .brand {
        text-shadow: 0 2px 16px rgba(255, 255, 255, 0.5);
      }
      .brand-logo {
        font-size: clamp(46px, 9.5vw, 92px);
        font-weight: 800;
        letter-spacing: 0.05em;
        line-height: 1;
        color: var(--text);
        animation: logoPulse 5s ease-in-out infinite;
      }
      .brand-logo b {
        color: var(--accent);
        font-weight: 800;
      }
      .brand-sub {
        font-size: clamp(12px, 1.6vw, 16px);
        letter-spacing: 0.46em;
        text-transform: uppercase;
        color: var(--text-dim);
        padding-left: 0.46em;
      }

      .progress-foot {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 4;
        padding: 0 0 26px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        pointer-events: none;
      }
      .progress-label {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: 13px;
        letter-spacing: 0.1em;
        color: var(--text-dim);
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.5);
      }
      .splash-screen[data-theme="light"] .progress-label,
      .splash-screen[data-theme="misty-sand"] .progress-label {
        text-shadow: 0 1px 10px rgba(255, 255, 255, 0.5);
      }
      .progress-label b {
        font-size: 23px;
        font-weight: 700;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        min-width: 3.4ch;
        text-align: right;
      }
      .progress-status {
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--text-dim);
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
        min-height: 1.2em;
      }
      .splash-screen[data-theme="light"] .progress-status,
      .splash-screen[data-theme="misty-sand"] .progress-status {
        text-shadow: 0 1px 10px rgba(255, 255, 255, 0.5);
      }

      @keyframes auroraBreathe {
        0%, 100% { transform: scale(1);    opacity: 0.92; }
        50%      { transform: scale(1.06); opacity: 1;    }
      }
      @keyframes veilPulse {
        0%, 100% { opacity: 0.06; }
        50%      { opacity: 0.16; }
      }
      @keyframes logoPulse {
        0%, 100% { opacity: 0.92; }
        50%      { opacity: 1;    }
      }
      @keyframes driftGreen {
        0%   { transform: translate(0, 0) scale(1); }
        33%  { transform: translate(9vmax, 6vmax) scale(1.14); }
        66%  { transform: translate(2vmax, 11vmax) scale(0.92); }
        100% { transform: translate(0, 0) scale(1); }
      }
      @keyframes driftPurple {
        0%   { transform: translate(0, 0) scale(1); }
        33%  { transform: translate(-10vmax, -5vmax) scale(0.9); }
        66%  { transform: translate(-3vmax, -10vmax) scale(1.12); }
        100% { transform: translate(0, 0) scale(1); }
      }
      @keyframes driftPink {
        0%   { transform: translate(0, 0) scale(1); }
        33%  { transform: translate(6vmax, -7vmax) scale(1.1); }
        66%  { transform: translate(-5vmax, -3vmax) scale(0.95); }
        100% { transform: translate(0, 0) scale(1); }
      }
      @keyframes driftCyan {
        0%   { transform: translate(0, 0) scale(1); }
        33%  { transform: translate(-7vmax, 7vmax) scale(1.06); }
        66%  { transform: translate(5vmax, 4vmax) scale(0.92); }
        100% { transform: translate(0, 0) scale(1); }
      }
      @keyframes flowR { from { background-position: 0% 50%; }   to { background-position: 100% 50%; } }
      @keyframes flowL { from { background-position: 100% 50%; } to { background-position: 0% 50%; } }
      @keyframes flowU { from { background-position: 50% 100%; } to { background-position: 50% 0%; } }
      @keyframes flowD { from { background-position: 50% 0%; }   to { background-position: 50% 100%; } }

      .splash-screen[data-theme="dark"] {
        --text: #f2f4f8;
        --text-dim: rgba(242, 244, 248, 0.58);
      }

      .splash-screen[data-theme="light"] {
        --aurora:
          radial-gradient(circle at 20% 30%, rgba(40, 170, 120, 0.30) 0%, transparent 38%),
          radial-gradient(circle at 80% 70%, rgba(120, 70, 200, 0.30) 0%, transparent 42%),
          radial-gradient(circle at 45% 75%, rgba(220, 120, 150, 0.26) 0%, transparent 32%),
          radial-gradient(circle at 65% 25%, rgba(40, 160, 190, 0.26) 0%, transparent 46%),
          linear-gradient(160deg, #f3f6fb, #e4e9f2, #d7deea);
        --text: #1b2330;
        --text-dim: rgba(27, 35, 48, 0.58);
      }
      .splash-screen[data-theme="light"] .blob-green  { background: radial-gradient(circle at 50% 50%, rgba(40, 170, 120, 0.42) 0%, rgba(40, 170, 120, 0) 66%); }
      .splash-screen[data-theme="light"] .blob-purple { background: radial-gradient(circle at 50% 50%, rgba(120, 70, 200, 0.42) 0%, rgba(120, 70, 200, 0) 66%); }
      .splash-screen[data-theme="light"] .blob-pink   { background: radial-gradient(circle at 50% 50%, rgba(220, 120, 150, 0.38) 0%, rgba(220, 120, 150, 0) 62%); }
      .splash-screen[data-theme="light"] .blob-cyan   { background: radial-gradient(circle at 50% 50%, rgba(40, 160, 190, 0.38) 0%, rgba(40, 160, 190, 0) 68%); }

      .splash-screen[data-theme="misty-sand"] {
        --aurora:
          radial-gradient(circle at 20% 30%, rgba(90, 180, 140, 0.26) 0%, transparent 40%),
          radial-gradient(circle at 80% 70%, rgba(150, 120, 210, 0.24) 0%, transparent 44%),
          radial-gradient(circle at 45% 75%, rgba(225, 170, 150, 0.22) 0%, transparent 34%),
          radial-gradient(circle at 65% 25%, rgba(110, 180, 200, 0.22) 0%, transparent 48%),
          linear-gradient(160deg, #eef4fb, #f7f1e8 50%, #eef5f0);
        --text: #2a3340;
        --text-dim: rgba(42, 51, 64, 0.58);
      }
      .splash-screen[data-theme="misty-sand"] .blob-green  { background: radial-gradient(circle at 50% 50%, rgba(90, 180, 140, 0.36) 0%, rgba(90, 180, 140, 0) 66%); }
      .splash-screen[data-theme="misty-sand"] .blob-purple { background: radial-gradient(circle at 50% 50%, rgba(150, 120, 210, 0.34) 0%, rgba(150, 120, 210, 0) 66%); }
      .splash-screen[data-theme="misty-sand"] .blob-pink   { background: radial-gradient(circle at 50% 50%, rgba(225, 170, 150, 0.32) 0%, rgba(225, 170, 150, 0) 62%); }
      .splash-screen[data-theme="misty-sand"] .blob-cyan   { background: radial-gradient(circle at 50% 50%, rgba(110, 180, 200, 0.32) 0%, rgba(110, 180, 200, 0) 68%); }

      @media (prefers-reduced-motion: reduce) {
        .splash-screen,
        .aurora-field,
        .aurora-veil,
        .blob,
        .aurora-stream.dir-r,
        .aurora-stream.dir-l,
        .aurora-stream.dir-u,
        .aurora-stream.dir-d,
        .brand-logo {
          animation: none !important;
        }
        .aurora-stream {
          background-size: 150% 150%;
          background-position: 50% 50%;
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div class="splash-screen" id="spash-waiting-for-js" hidden>
      <div class="aurora-field">
        <span class="blob blob-green"></span>
        <span class="blob blob-purple"></span>
        <span class="blob blob-pink"></span>
        <span class="blob blob-cyan"></span>
        <div class="aurora-stream dir-r" id="auroraStream"></div>
        <div class="aurora-veil"></div>
        <div class="aurora-vignette"></div>
      </div>

      <div class="brand">
        <div class="brand-logo">CY<b>SO</b></div>
        <div class="brand-sub">CYSOEditor</div>
      </div>

      <div class="progress-foot">
        <div class="progress-label">
          <span>正在载入</span>
          <b id="progressPct">0%</b>
        </div>
        <div class="progress-status" id="progressStatus">正在初始化…</div>
      </div>
    </div>

    <script>
      (function() {
        var splash = document.getElementById('spash-waiting-for-js');
        var app = document.getElementById('app');
        var reduceMotion = !!(window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches);

        // theme (read before React from localStorage)
        var theme = 'aurora';
        var accent = '#4F8EC2';
        try {
          var saved = localStorage.getItem('tw:theme');
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else if (saved) {
            try {
              var parsed = JSON.parse(saved);
              if (parsed.accent === 'purple') accent = '#855cd6';
              else if (parsed.accent === 'blue') accent = '#4c97ff';
              if (['dark', 'light', 'aurora', 'misty-sand'].indexOf(parsed.gui) !== -1) {
                theme = parsed.gui;
              }
            } catch (e) { /* ignore malformed value */ }
          }
        } catch (e) { /* localStorage may be unavailable */ }
        splash.setAttribute('data-theme', theme);
        splash.style.setProperty('--accent', accent);
        splash.hidden = false;

        var stream = document.getElementById('auroraStream');
        var pct = document.getElementById('progressPct');
        var statusEl = document.getElementById('progressStatus');

        var dirs = ['dir-r', 'dir-l', 'dir-u', 'dir-d'];
        var dir = 'dir-r';
        var lastMilestone = -1;
        var progress = 0;
        var goal = 22;
        var ready = false;
        var sawLoader = false;
        var rafId = 0;
        var lastTs = 0;

        function setStatus(text) {
          if (statusEl.textContent !== text) statusEl.textContent = text;
        }
        function setDir(next) {
          if (next === dir) return;
          dir = next;
          stream.className = 'aurora-stream ' + next;
        }
        function randomDir() {
          setDir(dirs[(Math.random() * dirs.length) | 0]);
        }
        function loaderPresent() {
          return !!(app && app.querySelector('[class*="loader_background"], [class*="loader_fullscreen"]'));
        }
        function checkLoader() {
          if (loaderPresent()) {
            sawLoader = true;
            setStatus('正在加载项目…');
          } else if (sawLoader) {
            sawLoader = false;
            ready = true;
            goal = 100;
            setStatus('即将完成…');
            stopWatching();
            startLoop();
          }
        }
        function update() {
          var p = Math.max(0, Math.min(100, progress));
          splash.style.setProperty('--p', p + '%');
          pct.textContent = Math.round(p) + '%';
          var ms = Math.floor(p / 15);
          if (ms !== lastMilestone) {
            lastMilestone = ms;
            if (!reduceMotion) randomDir();
          }
        }
        function frame(ts) {
          if (splash.classList.contains('splash-done')) return;
          var dt = Math.min(64, ts - lastTs) / 1000;
          lastTs = ts;
          var diff = goal - progress;
          if (Math.abs(diff) < 0.15) {
            if (ready && progress >= 99.4) {
              progress = 100;
              update();
              finish();
              return;
            }
            rafId = 0;
            return;
          }
          progress += diff * Math.min(1, dt * 5);
          if (!ready && progress > 96) progress = 96;
          update();
          rafId = window.requestAnimationFrame(frame);
        }
        function startLoop() {
          if (rafId) return;
          lastTs = window.performance.now();
          rafId = window.requestAnimationFrame(frame);
        }
        function finish() {
          window.cysoBootDone = true;
          splash.classList.add('splash-done');
          window.setTimeout(function() {
            splash.hidden = true;
            stopWatching();
          }, 720);
        }

        var appMo = null, twMo = null, loaderTimer = 0, po = null;
        function stopWatching() {
          if (appMo) { appMo.disconnect(); appMo = null; }
          if (twMo) { twMo.disconnect(); twMo = null; }
          if (loaderTimer) { window.clearInterval(loaderTimer); loaderTimer = 0; }
          if (po) { po.disconnect(); po = null; }
          if (rafId) { window.cancelAnimationFrame(rafId); rafId = 0; }
        }

        // entry bundle fetched (index.js)
        if ('PerformanceObserver' in window) {
          try {
            po = new PerformanceObserver(function(list) {
              list.getEntries().forEach(function(e) {
                if (/\/index\.js(\?|$)/.test(e.name || '') && e.responseEnd) {
                  goal = Math.max(goal, 58);
                  setStatus('正在加载界面…');
                  startLoop();
                  po.disconnect();
                  po = null;
                }
              });
            });
            po.observe({ entryTypes: ['resource'] });
          } catch (e) { /* ignore */ }
        }

        // DOM parsed + entry script executing -> React is mounting
        function onDomReady() {
          goal = Math.max(goal, 72);
          setStatus('正在准备编辑器…');
          startLoop();
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', onDomReady, { once: true });
        } else {
          onDomReady();
        }

        // React finished mounting: index.jsx adds 'tw-loaded' to <body>
        if ('MutationObserver' in window) {
          twMo = new MutationObserver(function(muts) {
            for (var i = 0; i < muts.length; i++) {
              var t = muts[i].target;
              if (t.classList && t.classList.contains('tw-loaded')) {
                goal = Math.max(goal, 88);
                setStatus('正在准备编辑器…');
                startLoop();
                twMo.disconnect();
                twMo = null;
                return;
              }
            }
          });
          twMo.observe(document.body, { attributes: true, attributeFilter: ['class'] });

          appMo = new MutationObserver(function() {
            checkLoader();
            startLoop();
          });
          appMo.observe(app, { childList: true, subtree: true });
        }
        loaderTimer = window.setInterval(checkLoader, 300);

        window.addEventListener('load', function() {
          goal = Math.max(goal, 90);
          startLoop();
        });

        // real sub-stage progress forwarded from loader.jsx
        window.addEventListener('cyso:load-progress', function(e) {
          var d = (e && e.detail) || {};
          if (d.total === 0) {
            goal = Math.max(goal, 88);
            setStatus('正在解析项目…');
          } else {
            goal = Math.min(96, 88 + (d.finished / d.total) * 8);
            setStatus((d.isRemote ? '正在下载素材 (' : '正在加载素材 (') +
              d.finished + '/' + d.total + ')…');
          }
          startLoop();
        });
        window.addEventListener('cyso:load-done', function() {
          if (!ready) {
            ready = true;
            goal = 100;
            setStatus('即将完成…');
            stopWatching();
            startLoop();
          }
        });

        // safety net: only if the editor never signals readiness
        window.setTimeout(function() {
          if (!ready) {
            ready = true;
            goal = 100;
            setStatus('即将完成…');
            startLoop();
          }
        }, 25000);

        startLoop();
      })();
    </script>

    <script>
      function webpackScriptError(event) {
        alert(`Error loading webpack script: ${event.target.src}`);
      }
    </script>
    <script src="index.js" onerror="webpackScriptError(event)"></script>
  </body>
</html>
