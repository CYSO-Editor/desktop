<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' cysoeditor://* tw-extensions://*; frame-src 'self' blob: cysoeditor://* tw-extensions://* https: http: data:; child-src 'self' blob:; connect-src 'self' cysoeditor://* tw-extensions://* https://gh-proxy.org https://raw.githubusercontent.com https://cyscrexthub.cc.cd https: http:; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob: data: https://gh-proxy.org https://raw.githubusercontent.com https://cyscrexthub.cc.cd https: cysoeditor://* tw-extensions://*; script-src-elem 'self' 'unsafe-inline' blob: data: https://gh-proxy.org https://raw.githubusercontent.com https://cyscrexthub.cc.cd https: cysoeditor://* tw-extensions://*; worker-src 'self' blob: https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' blob: data: https://gh-proxy.org https://raw.githubusercontent.com https://cyscrexthub.cc.cd https: http: cysoeditor://* tw-extensions://*; font-src 'self' blob: data: https:; media-src 'self' blob: data: cysoeditor://* tw-extensions://* https:">
    <!-- The CSP is deliberately permissive: user-installed extensions load inline code. -->
            <style>
      /* Mirrors aurora-splash.css. This inline copy owns the phase before React mounts and
         aurora-splash.jsx takes over from there, so the two must stay visually identical. */
      .splash-screen {
        --aurora:
          radial-gradient(circle at 22% 28%, rgba(70, 220, 160, 0.26) 0%, transparent 48%),
          radial-gradient(circle at 78% 72%, rgba(150, 90, 230, 0.28) 0%, transparent 52%),
          radial-gradient(circle at 62% 18%, rgba(50, 200, 220, 0.20) 0%, transparent 46%),
          radial-gradient(circle at 38% 82%, rgba(240, 160, 180, 0.18) 0%, transparent 44%);
        --base: linear-gradient(155deg, #050a18, #101a2c 55%, #050a18);
        --text: #eef3ff;
        --text-dim: rgba(238, 243, 255, 0.55);
        --track: rgba(255, 255, 255, 0.12);
        --accent: #4f8ec2;

        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 6000;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: var(--base);
        transition: opacity 0.6s ease;
        animation: splashIn 0.5s ease;
        --p: 0;
      }
      .splash-screen[hidden] { display: none; }
      .splash-screen.splash-done {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes splashIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .aurora-field {
        position: absolute;
        inset: 0;
        z-index: 1;
        background-image: var(--aurora), var(--base);
      }

      .brand {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        pointer-events: none;
        user-select: none;
      }
      .brand-logo {
        font-size: clamp(40px, 8vw, 76px);
        font-weight: 800;
        letter-spacing: 0.06em;
        line-height: 1;
        color: var(--text);
      }
      .brand-logo b {
        color: var(--accent);
        font-weight: 800;
      }
      .brand-sub {
        font-size: clamp(11px, 1.4vw, 14px);
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--text-dim);
        padding-left: 0.42em;
      }

      .progress-foot {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 4;
        padding: 0 clamp(20px, 4vw, 44px) clamp(16px, 2.6vh, 24px);
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: none;
        user-select: none;
      }
      .progress-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 20px;
      }
      .progress-status {
        font-size: 12.5px;
        letter-spacing: 0.04em;
        color: var(--text-dim);
        min-height: 1.3em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .progress-row b {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        flex: none;
      }
      .progress-track {
        position: relative;
        width: 100%;
        height: 2px;
        background: var(--track);
        overflow: hidden;
      }
      .progress-fill {
        position: absolute;
        inset: 0;
        transform: scaleX(var(--p, 0));
        transform-origin: left center;
        background: var(--accent);
      }

      .splash-screen[data-theme="dark"] {
        --text: #f2f4f8;
        --text-dim: rgba(242, 244, 248, 0.52);
      }

      .splash-screen[data-theme="light"] {
        --aurora:
          radial-gradient(circle at 22% 28%, rgba(40, 170, 120, 0.18) 0%, transparent 48%),
          radial-gradient(circle at 78% 72%, rgba(120, 70, 200, 0.18) 0%, transparent 52%),
          radial-gradient(circle at 62% 18%, rgba(40, 160, 190, 0.15) 0%, transparent 46%),
          radial-gradient(circle at 38% 82%, rgba(220, 120, 150, 0.14) 0%, transparent 44%);
        --base: linear-gradient(160deg, #f6f8fc, #e8edf5 55%, #f2f5fa);
        --text: #1b2330;
        --text-dim: rgba(27, 35, 48, 0.52);
        --track: rgba(20, 28, 44, 0.10);
        --accent: #4f8ec2;
      }

      .splash-screen[data-theme="misty-sand"] {
        --aurora:
          radial-gradient(circle at 22% 28%, rgba(90, 180, 140, 0.16) 0%, transparent 48%),
          radial-gradient(circle at 78% 72%, rgba(150, 120, 210, 0.15) 0%, transparent 52%),
          radial-gradient(circle at 62% 18%, rgba(110, 180, 200, 0.14) 0%, transparent 46%),
          radial-gradient(circle at 38% 82%, rgba(225, 170, 150, 0.14) 0%, transparent 44%);
        --base: linear-gradient(160deg, #eff4fa, #f7f2ea 52%, #eff5f1);
        --text: #2a3340;
        --text-dim: rgba(42, 51, 64, 0.52);
        --track: rgba(42, 51, 64, 0.10);
        --accent: #4f8ec2;
      }

      .splash-screen[data-theme="misty-sand-dark"] {
        --aurora:
          radial-gradient(circle at 22% 28%, rgba(90, 180, 140, 0.16) 0%, transparent 48%),
          radial-gradient(circle at 78% 72%, rgba(150, 120, 210, 0.18) 0%, transparent 52%),
          radial-gradient(circle at 62% 18%, rgba(110, 180, 200, 0.15) 0%, transparent 46%),
          radial-gradient(circle at 38% 82%, rgba(225, 170, 150, 0.13) 0%, transparent 44%);
        --base: linear-gradient(160deg, #191b22, #212127 52%, #1b1d23);
        --text: #e8e9ee;
        --text-dim: rgba(232, 233, 238, 0.55);
        --track: rgba(255, 255, 255, 0.12);
        --accent: #7db3f5;
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-screen { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div class="splash-screen" id="splash-waiting-for-js" hidden>
      <div class="aurora-field"></div>

      <div class="brand">
        <div class="brand-logo">CY<b>SO</b></div>
        <div class="brand-sub">CYSOEditor</div>
      </div>

      <div class="progress-foot">
        <div class="progress-row">
          <div class="progress-status" id="progressStatus">正在初始化…</div>
          <b id="progressPct">0%</b>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>

    <script>
      (function() {
        var splash = document.getElementById('splash-waiting-for-js');
        var reduceMotion = !!(window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches);

        var theme = 'aurora';
        var accent = '#4F8EC2';
        try {
          var saved = localStorage.getItem('tw:theme');
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else if (saved) {
            try {
              var parsed = JSON.parse(saved);
              if (parsed.accent === 'purple') accent = '#855cd6';
              else if (parsed.accent === 'blue') accent = '#4c97ff';
              if (['dark', 'light', 'aurora', 'misty-sand'].indexOf(parsed.gui) !== -1) {
                theme = parsed.gui;
              }
            } catch (e) { /* ignore malformed value */ }
          }
        } catch (e) { /* localStorage may be unavailable */ }
        if (theme === 'misty-sand') {
          try {
            var customRaw = localStorage.getItem('tw:customTheme');
            var customParsed = customRaw ? JSON.parse(customRaw) : null;
            if (customParsed && customParsed.darkMode) {
              theme = 'misty-sand-dark';
            }
          } catch (e) { /* ignore malformed custom theme */ }
        }
        splash.setAttribute('data-theme', theme);
        splash.style.setProperty('--accent', accent);
        splash.hidden = false;


        var pct = document.getElementById('progressPct');
        var statusEl = document.getElementById('progressStatus');

        // Stage ceilings for the pre-React phase; aurora-splash.jsx continues from HANDOFF_PROGRESS.
        var GOAL_BOOT = 10;
        var GOAL_BUNDLE = 22;
        var GOAL_DOM = 32;
        var HANDOFF_PROGRESS = 40;
        var STATUS_BOOT = '正在初始化…';
        var STATUS_BUNDLE = '正在加载界面…';
        var STATUS_DOM = '正在准备编辑器…';

        var progress = 0;
        var goal = GOAL_BOOT;
        var status = STATUS_BOOT;
        var handedOff = false;
        var reactReady = window.cysoReactSplashReady === true;
        var rafId = 0;
        var lastTs = 0;
        var hideTimer = 0;

        function render() {
          splash.style.setProperty('--p', (progress / 100).toFixed(4));
          pct.textContent = Math.round(progress) + '%';
          if (statusEl.textContent !== status) statusEl.textContent = status;
        }
        function advance(nextGoal, nextStatus) {
          if (handedOff) return;
          if (nextGoal > goal) goal = nextGoal;
          status = nextStatus;
          startLoop();
        }
        function frame(ts) {
          rafId = 0;
          var dt = Math.min(64, ts - lastTs) / 1000;
          lastTs = ts;
          var diff = goal - progress;
          if (Math.abs(diff) < 0.15) return;
          progress += diff * Math.min(1, dt * 5);
          render();
          rafId = window.requestAnimationFrame(frame);
        }
        function startLoop() {
          if (rafId || handedOff) return;
          lastTs = window.performance.now();
          rafId = window.requestAnimationFrame(frame);
        }
        function stop() {
          if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
          }
          if (hideTimer) {
            window.clearTimeout(hideTimer);
            hideTimer = 0;
          }
        }
        function dismiss() {
          stop();
          splash.classList.add('splash-done');
          hideTimer = window.setTimeout(function() {
            hideTimer = 0;
            splash.hidden = true;
          }, 720);
        }

        // React 挂载完成到它画出加载界面之间有空档，此时 #app 还是空的，所以要等它接管。
        window.addEventListener('cyso:react-splash-ready', function onReady() {
          window.removeEventListener('cyso:react-splash-ready', onReady);
          reactReady = true;
          if (handedOff) {
            window.setTimeout(dismiss, 60);
          }
        });

        function dismissWhenReactReady() {
          if (reactReady) {
            window.setTimeout(dismiss, 60);
            return;
          }
          window.setTimeout(function () {
            if (!reactReady) {
              dismiss();
            }
          }, 8000);
        }

        function handOff() {
          if (handedOff) return;
          handedOff = true;
          stop();
          var detail = {progress: Math.max(progress, HANDOFF_PROGRESS), status: status};
          window.cysoBootDone = true;
          // 事件可能早于 React 挂载被丢弃，值同时留在 window 上供挂载后读取。
          window.cysoBootHandoff = detail;
          window.dispatchEvent(new CustomEvent('cyso:load-handoff', {detail: detail}));
          dismissWhenReactReady();
        }

        if ('PerformanceObserver' in window) {
          try {
            var po = new PerformanceObserver(function(list) {
              list.getEntries().forEach(function(e) {
                if (/\/index\.js(\?|$)/.test(e.name || '') && e.responseEnd) {
                  po.disconnect();
                  po = null;
                  advance(GOAL_BUNDLE, STATUS_BUNDLE);
                }
              });
            });
            po.observe({entryTypes: ['resource']});
          } catch (e) { /* ignore */ }
        }

        function onDomReady() {
          advance(GOAL_DOM, STATUS_DOM);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', onDomReady, {once: true});
        } else {
          onDomReady();
        }

        if ('MutationObserver' in window) {
          var mo = new MutationObserver(function(muts) {
            for (var i = 0; i < muts.length; i++) {
              var t = muts[i].target;
              if (t.classList && t.classList.contains('tw-loaded')) {
                mo.disconnect();
                mo = null;
                handOff();
                return;
              }
            }
          });
          mo.observe(document.body, {attributes: true, attributeFilter: ['class']});
        }

        // The entry bundle never arrived, so React will never mount and nothing can take over.
        window.setTimeout(function() {
          if (!handedOff) handOff();
        }, 25000);

        startLoop();
      })();
    </script>

    <script>
      function webpackScriptError(event) {
        alert(`Error loading webpack script: ${event.target.src}`);
      }
    </script>
    <script src="index.js" onerror="webpackScriptError(event)"></script>
  </body>
</html>
